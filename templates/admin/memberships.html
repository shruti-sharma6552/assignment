{% extends "base.html" %}
{% block title %}Memberships — admin{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Memberships</h1>

<div class="card cp-card mb-4"><div class="card-body">
  <h2 class="h6 mb-3">Add a membership</h2>
  <form method="post" action="{{ url_for('admin.memberships') }}" class="row g-3 align-items-end">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-4"><label class="form-label" for="name">Name</label>
      <input class="form-control" id="name" name="name" required></div>
    <div class="col-md-3"><label class="form-label" for="discount_percentage">Discount (%)</label>
      <input class="form-control" type="number" step="0.01" min="0" max="100"
             id="discount_percentage" name="discount_percentage" required></div>
    <div class="col-md-3"><label class="form-label" for="discount_cap">Maximum discount (₹)</label>
      <input class="form-control" type="number" step="0.01" min="0" id="discount_cap" name="discount_cap" required></div>
    <div class="col-md-1 form-check mb-2">
      <input class="form-check-input" type="checkbox" id="active" name="active" checked>
      <label class="form-check-label" for="active">Active</label></div>
    <div class="col-md-1"><button class="btn btn-warning w-100" type="submit">Save</button></div>
  </form>
</div></div>

{% for m in memberships %}
  <div class="card cp-card mb-2"><div class="card-body">
    <form method="post" action="{{ url_for('admin.memberships') }}" class="row g-3 align-items-end">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="membership_id" value="{{ m.id }}">
      <div class="col-md-4"><label class="form-label" for="name-{{ m.id }}">Name</label>
        <input class="form-control" id="name-{{ m.id }}" name="name" value="{{ m.name }}" required></div>
      <div class="col-md-3"><label class="form-label" for="pct-{{ m.id }}">Discount (%)</label>
        <input class="form-control" id="pct-{{ m.id }}" type="number" step="0.01" min="0" max="100"
               name="discount_percentage" value="{{ '%.2f'|format(m.discount_percentage) }}" required></div>
      <div class="col-md-3"><label class="form-label" for="cap-{{ m.id }}">Maximum discount (₹)</label>
        <input class="form-control" id="cap-{{ m.id }}" type="number" step="0.01" min="0"
               name="discount_cap" value="{{ '%.2f'|format(m.discount_cap) }}" required></div>
      <div class="col-md-1 form-check mb-2">
        <input class="form-check-input" type="checkbox" id="active-{{ m.id }}" name="active" {% if m.active %}checked{% endif %}>
        <label class="form-check-label" for="active-{{ m.id }}">Active</label></div>
      <div class="col-md-1"><button class="btn btn-outline-warning w-100" type="submit">Update</button></div>
    </form>
  </div></div>
{% endfor %}
{% endblock %}
